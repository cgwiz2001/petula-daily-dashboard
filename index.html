<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Daily Dashboard · locked</title>
<style>
  :root { --bg:#07090f; --cyan:#2de2e6; --purple:#b794f6; --blue:#5b8cff; --orange:#ff8a3d; --text:#eef3ff; --muted:#9aa8c7; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    font-family:"Segoe UI",system-ui,sans-serif; color:var(--text);
    background:
      radial-gradient(700px 400px at 15% 0%, rgba(183,148,246,.2), transparent 55%),
      radial-gradient(700px 400px at 90% 10%, rgba(45,226,230,.12), transparent 50%),
      var(--bg);
  }
  .card {
    width:min(420px,92vw); padding:28px 24px; border-radius:18px;
    background:rgba(12,16,28,.92);
    border:1.5px solid rgba(91,140,255,.45);
    box-shadow:0 0 28px rgba(91,140,255,.25), 0 0 60px rgba(183,148,246,.12);
  }
  h1 { margin:0 0 6px; font-size:1.35rem;
    background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple));
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { margin:0 0 18px; color:var(--muted); font-size:.92rem; }
  label { display:block; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--cyan); margin-bottom:8px; }
  input {
    width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(45,226,230,.35);
    background:#0b1220; color:var(--text); font-size:1rem; outline:none;
    box-shadow:0 0 16px rgba(45,226,230,.12);
  }
  input:focus { border-color:var(--purple); box-shadow:0 0 20px rgba(183,148,246,.25); }
  button {
    margin-top:14px; width:100%; padding:12px 14px; border:0; border-radius:12px;
    font-weight:700; cursor:pointer; color:#071018;
    background:linear-gradient(90deg,var(--cyan),var(--blue));
    box-shadow:0 0 22px rgba(45,226,230,.35);
  }
  button.ghost {
    background:transparent; color:var(--text);
    border:1px solid rgba(91,140,255,.4);
    box-shadow:none; font-weight:600;
  }
  button.danger {
    background:transparent; color:#ff6b7a;
    border:1px solid rgba(255,107,122,.35);
    box-shadow:none; font-weight:600;
  }
  .err { color:#ff6b7a; font-size:.86rem; margin-top:10px; min-height:1.2em; }
  .ok { color:var(--cyan); font-size:.86rem; margin-top:10px; }
  .hidden { display:none; }
</style>
</head>
<body>
  <div class="card" id="gate">
    <h1>Daily Dashboard</h1>
    <p id="sub">Password-protected · Petula</p>

    <div id="bioPane" class="hidden">
      <button id="bio" type="button">Unlock with Touch ID</button>
      <button id="usePw" class="ghost" type="button">Use password instead</button>
    </div>

    <div id="pwPane">
      <label for="pw">Unlock password</label>
      <input id="pw" type="password" autocomplete="current-password">
      <button id="goSave" type="button">Unlock and save Touch ID</button>
      <button id="go" class="ghost" type="button">Unlock only</button>
    </div>

    <div id="savePane" class="hidden">
      <p>Save Touch ID on this device so you don’t type the password next time?</p>
      <button id="saveBio" type="button">Save Touch ID</button>
      <button id="skipBio" class="ghost" type="button">Not now</button>
    </div>

    <button id="forget" class="danger hidden" type="button">Forget Touch ID on this device</button>
    <div class="err" id="err"></div>
    <div class="ok" id="ok"></div>
  </div>

  const DB_NAME = 'petula-dash';
  const STORE = 'vault';
  const enc = new TextEncoder();
  const dec = new TextDecoder();
  let pendingHtml = null;
  let pendingPassword = null;

  function b64(s) {
    const bin = atob(s); const u = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u;
  }
  function b64e(u8) {
    let s=''; u8 = new Uint8Array(u8);
    for (let i=0;i<u8.length;i++) s += String.fromCharCode(u8[i]);
    return btoa(s);
  }
  function rand(n) { const u = new Uint8Array(n); crypto.getRandomValues(u); return u; }
  function err(msg) { document.getElementById('err').textContent = msg || ''; document.getElementById('ok').textContent = ''; }
  function ok(msg) { document.getElementById('ok').textContent = msg || ''; document.getElementById('err').textContent = ''; }
  function show(id, on) { document.getElementById(id).classList.toggle('hidden', !on); }

  function idb() {
    return new Promise((resolve, reject) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  }
  async function vaultGet() {
    const db = await idb();
    return new Promise((resolve, reject) => {
      const q = db.transaction(STORE, 'readonly').objectStore(STORE).get('v1');
      q.onsuccess = () => resolve(q.result || null);
      q.onerror = () => reject(q.error);
    });
  }
  async function vaultSet(v) {
    const db = await idb();
    return new Promise((resolve, reject) => {
      const q = db.transaction(STORE, 'readwrite').objectStore(STORE).put(v, 'v1');
      q.onsuccess = () => resolve();
      q.onerror = () => reject(q.error);
    });
  }
  async function vaultClear() {
    const db = await idb();
    return new Promise((resolve, reject) => {
      const q = db.transaction(STORE, 'readwrite').objectStore(STORE).delete('v1');
      q.onsuccess = () => resolve();
      q.onerror = () => reject(q.error);
    });
  }

  async function deriveKey(password, salt, iterations) {
    const base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt, iterations, hash:'SHA-256' },
      base,
      { name:'AES-GCM', length:256 },
      false,
      ['decrypt']
    );
  }
  async function decryptWithPassword(password) {
    const key = await deriveKey(password, b64(BLOB.salt), BLOB.iter);
    const plain = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv: b64(BLOB.iv) },
      key,
      b64(BLOB.ct)
    );
    return dec.decode(plain);
  }
  function openDash(html) {
    document.open(); document.write(html); document.close();
  }

  function bioAvailable() {
    return window.PublicKeyCredential && location.protocol === 'https:';
  }

  async function wrapPassword(password, prfBits) {
    const raw = prfBits || rand(32);
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
    const iv = rand(12);
    const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, enc.encode(password));
    return { iv: b64e(iv), ct: b64e(ct), rawIfNoPrf: prfBits ? null : b64e(raw) };
  }
  async function unwrapPassword(rec, prfBits) {
    const raw = prfBits || b64(rec.rawIfNoPrf);
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64(rec.iv) }, key, b64(rec.ct));
    return dec.decode(pt);
  }
  function prfFrom(cred) {
    try {
      const ext = cred.getClientExtensionResults && cred.getClientExtensionResults();
      const first = ext && ext.prf && ext.prf.results && ext.prf.results.first;
      return first ? new Uint8Array(first) : null;
    } catch (e) { return null; }
  }

  async function registerBio(password) {
    const userId = rand(16);
    const prfSalt = rand(32);
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: rand(32),
        rp: { name: 'Daily Dashboard', id: location.hostname },
        user: { id: userId, name: 'dashboard', displayName: 'Daily Dashboard' },
        pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
        authenticatorSelection: {
          authenticatorAttachment: 'platform',
          userVerification: 'required',
          residentKey: 'preferred'
        },
        timeout: 60000,
        extensions: { prf: { eval: { first: prfSalt } } }
      }
    });
    if (!cred) throw new Error('cancelled');
    const prf = prfFrom(cred);
    const wrapped = await wrapPassword(password, prf);
    await vaultSet({
      credId: b64e(new Uint8Array(cred.rawId)),
      prfSalt: b64e(prfSalt),
      usedPrf: !!prf,
      iv: wrapped.iv,
      ct: wrapped.ct,
      rawIfNoPrf: wrapped.rawIfNoPrf
    });
  }

  async function unlockBio() {
    err('');
    const rec = await vaultGet();
    if (!rec) { err('No Touch ID saved on this device.'); return; }
    const cred = await navigator.credentials.get({
      publicKey: {
        challenge: rand(32),
        allowCredentials: [{ type:'public-key', id: b64(rec.credId) }],
        userVerification: 'required',
        timeout: 60000,
        extensions: rec.usedPrf ? { prf: { eval: { first: b64(rec.prfSalt) } } } : {}
      }
    });
    const prf = rec.usedPrf ? prfFrom(cred) : null;
    if (rec.usedPrf && !prf) throw new Error('Touch ID key missing — use password once to re-save.');
    const password = await unwrapPassword(rec, prf);
    const html = await decryptWithPassword(password);
    openDash(html);
  }

  async function unlockPassword(wantBio) {
    err('');
    const password = document.getElementById('pw').value;
    if (!password) { err('Enter the password.'); return; }
    try {
      const html = await decryptWithPassword(password);
      pendingHtml = html;
      pendingPassword = password;
      if (location.protocol !== 'https:') {
        err('Touch ID needs the hosted HTTPS page. Opening dashboard.');
        setTimeout(() => openDash(html), 900);
        return;
      }
      if (wantBio) {
        try {
          await registerBio(password);
          ok('Touch ID saved. Opening dashboard…');
          setTimeout(() => openDash(html), 500);
        } catch (e) {
          err((e && e.message) ? e.message : 'Touch ID was cancelled. You can try again.');
          show('pwPane', false);
          show('savePane', true);
          document.getElementById('sub').textContent = 'Unlocked · save Touch ID?';
        }
        return;
      }
      show('pwPane', false);
      show('bioPane', false);
      show('savePane', true);
      document.getElementById('sub').textContent = 'Unlocked · save Touch ID?';
    } catch (e) {
      err('Wrong password, or the page could not be decrypted.');
    }
  }

  async function init() {
    const rec = await vaultGet().catch(() => null);
    const https = bioAvailable();
    if (rec && https) {
      show('bioPane', true);
      show('pwPane', false);
      show('forget', true);
      document.getElementById('sub').textContent = 'Touch ID on this device · Petula';
    } else if (!https) {
      document.getElementById('sub').textContent = 'Password-protected · open the hosted HTTPS link for Touch ID';
    }
  }

  document.getElementById('goSave').addEventListener('click', () => unlockPassword(true));
  document.getElementById('go').addEventListener('click', () => unlockPassword(false));
  document.getElementById('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlockPassword(true); });
  document.getElementById('bio').addEventListener('click', async () => {
    try { await unlockBio(); } catch (e) { err(e.message || 'Touch ID cancelled. Use password instead.'); show('pwPane', true); }
  });
  document.getElementById('usePw').addEventListener('click', () => { show('pwPane', true); document.getElementById('pw').focus(); });
  document.getElementById('saveBio').addEventListener('click', async () => {
    try {
      await registerBio(pendingPassword);
      ok('Touch ID saved on this device.');
      openDash(pendingHtml);
    } catch (e) {
      err('Could not save Touch ID. Opening dashboard anyway.');
      setTimeout(() => openDash(pendingHtml), 700);
    }
  });
  document.getElementById('skipBio').addEventListener('click', () => openDash(pendingHtml));
  document.getElementById('forget').addEventListener('click', async () => {
    await vaultClear();
    show('bioPane', false); show('forget', false); show('pwPane', true);
    document.getElementById('sub').textContent = 'Password-protected · Petula';
    ok('Touch ID forgotten on this device.');
  });
  init();
  </script>
